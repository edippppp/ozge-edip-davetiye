<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Özge &amp; Edip — 07 Kasım 2026 Düğün Davetiyesi</title>
    <meta
      name="description"
      content="Özge ve Edip'in düğün davetiyesi. 07 Kasım 2026, Address Hotel Emaar, İstanbul. Katılım durumunuzu davetiye üzerinden bildirebilirsiniz."
    />
    <meta name="theme-color" content="#ddd5cb" />

    <!-- WhatsApp / sosyal medya önizlemesi -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="Özge &amp; Edip — Düğün Davetiyesi" />
    <meta
      property="og:description"
      content="07 Kasım 2026 · Address Hotel Emaar, İstanbul. Sizleri aramızda görmek bizi çok mutlu edecek."
    />
    <meta property="og:url" content="https://edippppp.github.io/ozge-edip-davetiye/iki-kisi/" />
    <meta property="og:image" content="https://edippppp.github.io/ozge-edip-davetiye/assets/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://edippppp.github.io/ozge-edip-davetiye/assets/img/og.jpg" />

    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/davetiye.css?v=8" />
  </head>

  <!-- data-kisi: davetiyenin kaç kişilik olduğu (1 veya 2) -->
  <body data-kisi="2">
    <main class="davetiye">
      <!-- Kapak, davet ve program: Davetiye.jpeg'den kırpılmış kanatlar -->
      <section class="kanat kanat--foto acilan" aria-label="Davetiye kapağı">
        <img
          src="../assets/img/panel-kapak.jpg"
          alt="Özge ve Edip düğün davetiyesi kapağı"
          width="1128"
          height="1884"
          fetchpriority="high"
          style="width:100%;height:auto;max-width:100%;display:block"
        />
      </section>

      <section class="kanat kanat--foto kanat--davet acilan" id="davet" aria-label="Davet">
        <div class="foto-sarma">
          <img
            src="../assets/img/panel-davet.jpg"
            alt="Davet metni, tarih ve mekan"
            width="926"
            height="1820"
            style="width:100%;height:auto;max-width:100%;display:block"
          />
          <p class="foto-kisi majuskul">
            DAVETİYEMİZ <span class="davet__kisi-sayi">İKİ</span> KİŞİLİKTİR.
          </p>
        </div>
      </section>

      <section class="kanat kanat--foto kanat--program acilan" aria-label="Program">
        <img
          src="../assets/img/panel-program.jpg"
          alt="Düğün programı"
          width="732"
          height="1848"
          style="width:100%;height:auto;max-width:100%;display:block"
        />
        <p class="foto-linkler">
          <a
            class="ince-bag"
            href="https://maps.google.com/?q=Address+Hotel+Emaar+%C4%B0stanbul"
            target="_blank"
            rel="noopener"
            >YOL TARİFİ</a
          >
          <a class="ince-bag" href="../assets/ozge-edip-dugun.ics" download>TAKVİME EKLE</a>
        </p>
      </section>

      <!-- ==================== KATILIM FORMU =================== -->
      <section class="kanat kanat--rsvp acilan" id="cevap" aria-label="Katılım bildirimi">
        <div class="bordur" aria-hidden="true">
          <span class="bordur__cizgi"></span>
          <img class="bordur__yaprak" src="../assets/svg/sus-ginkgo.svg" alt="" width="100" height="90" />
          <span class="bordur__cizgi"></span>
        </div>

        <h2 class="majuskul ortala baslik">LÜTFEN CEVAP VERİNİZ</h2>
        <p class="majuskul majuskul--ince ortala rsvp__aciklama">
          KATILIM DURUMUNUZU<br />BİZİMLE PAYLAŞIRSANIZ<br />ÇOK MUTLU OLURUZ.
        </p>

        <form class="form" id="katilimFormu" novalidate>
          <input type="hidden" name="davetiyeTipi" value="2 Kişilik" />
          <div class="form__ikili">
            <p class="alan">
              <label class="alan__etiket" for="ad">ADINIZ</label>
              <input
                class="alan__giris"
                type="text"
                id="ad"
                name="ad"
                autocomplete="given-name"
                maxlength="60"
                required
              />
              <span class="alan__hata" data-hata-for="ad"></span>
            </p>
            <p class="alan">
              <label class="alan__etiket" for="soyad">SOYADINIZ</label>
              <input
                class="alan__giris"
                type="text"
                id="soyad"
                name="soyad"
                autocomplete="family-name"
                maxlength="60"
                required
              />
              <span class="alan__hata" data-hata-for="soyad"></span>
            </p>
          </div>

          <p class="alan">
            <label class="alan__etiket" for="telefon">TELEFON NUMARANIZ</label>
            <input
              class="alan__giris"
              type="tel"
              id="telefon"
              name="telefon"
              inputmode="tel"
              autocomplete="tel"
              placeholder="0(5__) ___ __ __"
              maxlength="17"
              required
            />
            <span class="alan__hata" data-hata-for="telefon"></span>
          </p>

          <fieldset class="alan alan--secim">
            <legend class="alan__etiket">KATILIM DURUMUNUZ</legend>
            <div class="secimler">
              <label class="secim">
                <input type="radio" name="katilim" value="Katılacağım" required />
                <span class="secim__kutu">
                  <span class="secim__isaret" aria-hidden="true"></span>
                  <span class="secim__yazi">KATILACAĞIM</span>
                </span>
              </label>
              <label class="secim">
                <input type="radio" name="katilim" value="Katılamayacağım" required />
                <span class="secim__kutu">
                  <span class="secim__isaret" aria-hidden="true"></span>
                  <span class="secim__yazi">KATILAMAYACAĞIM</span>
                </span>
              </label>
            </div>
            <span class="alan__hata" data-hata-for="katilim"></span>
          </fieldset>

          <p class="alan">
            <label class="alan__etiket alan__etiket--cumle" for="notu">Dilerseniz bize not bırakabilirsiniz</label>
            <textarea
              class="alan__giris alan__giris--uzun"
              id="notu"
              name="notu"
              rows="4"
              maxlength="600"
            ></textarea>
          </p>

          <button class="dugme" type="submit" id="gonderDugmesi">
            <span class="dugme__yazi">GÖNDER</span>
            <span class="dugme__yukleniyor" aria-hidden="true"></span>
          </button>

          <p class="form__durum" id="formDurumu" role="status" aria-live="polite"></p>
        </form>

        <!-- Gönderim sonrası teşekkür kartı -->
        <div class="tesekkur" id="tesekkurKarti" hidden>
          <img class="tesekkur__yaprak" src="../assets/svg/sus-ginkgo.svg" alt="" width="100" height="90" />
          <p class="el-yazisi tesekkur__baslik">Teşekkür ederiz</p>
          <p class="majuskul majuskul--ince ortala tesekkur__metin" id="tesekkurMetin"></p>
          <button class="ince-bag tesekkur__yeniden" type="button" id="yenidenGonder">
            CEVABIMI GÜNCELLE
          </button>
        </div>

        <div class="bordur" aria-hidden="true">
          <span class="bordur__cizgi"></span>
          <img class="bordur__yaprak" src="../assets/svg/sus-ginkgo.svg" alt="" width="100" height="90" />
          <span class="bordur__cizgi"></span>
        </div>
      </section>
    </main>

    <footer class="dip">
      <p class="el-yazisi dip__isimler">Özge <span class="el-yazisi__ve">ve</span> Edip</p>
      <p class="majuskul majuskul--ince">07 KASIM 2026</p>
    </footer>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/davetiye.js"></script>
  </body>
</html>
